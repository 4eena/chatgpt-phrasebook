<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="フレーズ集"><title>ChatGPT 指示づくり｜フレーズ集</title><style>
:root{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;color-scheme:light dark}body{margin:0;background:#f3f5f9;color:#1c2433}.wrap{max-width:1100px;margin:auto;padding:28px 20px 90px}h1{margin:0 0 6px;font-size:27px}.muted{color:#64748b}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select,button,textarea{font:inherit}input,select{padding:11px 13px;border:1px solid #ccd4e0;border-radius:10px;background:white;color:#1c2433}input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}.card{background:white;border:1px solid #dde3ec;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 4px #00000008}.top{display:flex;align-items:center;gap:9px}.number{background:#e8eef9;border-radius:7px;padding:4px 7px;color:#344f8b;font-weight:700}.title{font-weight:700}.category{font-size:12px;color:#64748b}.body{line-height:1.7;white-space:pre-wrap;flex:1}.actions{display:flex;gap:7px;flex-wrap:wrap}button{border:1px solid #ccd4e0;border-radius:9px;padding:8px 11px;cursor:pointer;background:#fff;color:#243044}button:hover{background:#eef3fa}.primary{background:#234baf;color:white;border-color:#234baf}.primary:hover{background:#183c99}.selected{border-color:#234baf}.composer{position:sticky;bottom:0;background:#fff;border-top:1px solid #d8e0eb;box-shadow:0 -3px 15px #00000010;padding:13px 20px;margin:35px -20px -90px}.composer-inner{max-width:1100px;margin:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.composer strong{margin-right:auto}.small{font-size:13px}[hidden]{display:none!important}@media(max-width:640px){.wrap{padding:18px 12px 70px}h1{font-size:23px}.toolbar{gap:8px}.toolbar input{min-width:0;width:100%;flex-basis:100%}.grid{grid-template-columns:1fr}.card{padding:14px}.composer{margin:25px -12px -70px;padding:10px 12px}.composer-inner{gap:6px}.composer strong{width:100%}.composer button{flex:1}button{min-height:42px}#composed{height:110px}}.toast{position:fixed;top:14px;right:16px;background:#1f2937;color:white;padding:10px 15px;border-radius:9px;display:none}#composed{width:100%;height:80px;box-sizing:border-box;margin-top:10px;padding:10px;border:1px solid #ccd4e0;border-radius:9px;background:#fff;color:#1c2433}label{display:flex;align-items:center;gap:5px}@media(prefers-color-scheme:dark){body{background:#111827;color:#f2f5fb}.muted,.category{color:#a9b4c7}.card,.composer{background:#1d2738;border-color:#39485e}input,select,button,#composed{background:#27344a;color:#fff;border-color:#53627a}.number{background:#31446a;color:#c9dcff}.primary{background:#4169d5}.primary:hover{background:#3358bc}button:hover{background:#344660}}</style></head><body><main class="wrap"><h1>ChatGPT 指示づくり</h1><div class="muted">やりたいことから指示を作成。12種類のフレーズを選んで組み合わせることもできます。</div><section class="card" aria-labelledby="aiTitle" style="margin-top:20px"><h2 id="aiTitle" style="margin:0;font-size:20px">✨ AIにおまかせ</h2><p class="muted" style="margin:0">やりたいことを書くだけ。ChatGPTが12選から必要な指示を選び、実行用プロンプトを作ります。API料金は不要です。</p><label for="aiGoal">やりたいこと</label><textarea id="aiGoal" rows="3" placeholder="例：既存のWebサイトを改善したい" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd4e0;border-radius:10px;font:inherit"></textarea><div class="actions"><button class="primary" id="aiCopy">ChatGPTへの依頼文をコピー</button><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer" style="align-self:center">ChatGPTを開く ↗</a></div><p class="muted small" style="margin:0">① 目的を入力 → ② コピー → ③ ChatGPTに貼り付け。指示の作成だけを依頼し、作業はまだ実行しません。</p></section><div class="toolbar"><input id="q" placeholder="検索：テスト、GitHub、完成、コスト…" aria-label="フレーズ検索"><select id="cat" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option></select><label><input type="checkbox" id="favonly">お気に入りのみ</label><button id="clear">検索をリセット</button></div><p class="muted small" id="count"></p><section class="grid" id="cards"></section><div class="composer"><div class="composer-inner"><strong>組み合わせ <span id="chosenCount">0</span>件</strong><button id="copyCombined" class="primary">まとめてコピー</button><button id="resetChosen">選択解除</button></div><textarea id="composed" readonly placeholder="「追加」を押すと、ここにフレーズを組み合わせます"></textarea></div></main><div id="toast" class="toast" role="status"></div><script>
const data=[{"id":"01","title":"目的から実行まで","category":"基本","body":"〇〇したい。目的と完成条件を整理し、見落としや効率の良い方法を指摘して。Chat・Codex・Workから適切な手段を選び、できるところまで実行して。"},{"id":"02","title":"必要性・費用対効果を判断","category":"基本","body":"作業を始める前に、そもそも必要か判断して。既存の成果物で代用できないか、費用・効果・難易度・リスクを比較し、続行・縮小・延期・中止から一つ推薦して。"},{"id":"03","title":"無駄を減らして完成させる","category":"基本","body":"目的に必須でない作業を省き、最短で完成に近づく順番で進めて。計画だけで終わらず、実装・テスト・修正・再検証まで行い、完成条件を満たしたら不要な追加作業を増やさず終了して。"},{"id":"04","title":"根拠と品質を検証","category":"品質・検証","body":"回答や成果物の根拠を確認し、重大なバグ・セキュリティ問題・保守性の問題を優先順位付きで指摘して。事実・推測・未確認を区別し、重要な問題から検証して。"},{"id":"05","title":"完成判定・実機確認","category":"品質・検証","body":"完成条件を一つずつ検証して。実装済み・テスト成功・実機確認済み・未検証を区別し、証拠のない完成報告はしないで。"},{"id":"06","title":"既存開発を引き継ぐ","category":"開発","body":"既存プロジェクトの最新版・仕様・決定事項・テスト結果を確認して続きを進めて。GitHubを正本として履歴を維持し、不要な作り直しやZIPの重複を避けて。"},{"id":"07","title":"既製品・OSSを活用する","category":"開発","body":"開発前に同じ目的を達成できる既製品・OSS・ライブラリ・APIを調べて。そのまま利用・拡張・部分流用・自作を、機能・費用・更新状況・ライセンス・保守負担で比較して。既存実装からの移行コストや失われる機能も評価し、乗り換えが不利なら現状を維持して。"},{"id":"08","title":"バグの根本原因を直す","category":"開発","body":"エラーの根本原因と再現条件を調査して。推測だけで修正せず、最小限の修正と回帰テストを行って。同じ失敗を繰り返す場合は原因を分析して別の手段に切り替えて。"},{"id":"09","title":"最適案を比較・推薦","category":"調査・判断","body":"選択肢を費用・効果・難易度・リスクで比較して。無料・既存OSS・現在の環境を優先し、私の条件に最も合う方法を一つ推薦して。不明点は明示して。"},{"id":"10","title":"最新情報と反対意見を調べる","category":"調査・判断","body":"最新の公式情報と信頼できる資料を調べ、出典と更新日を示して。この計画が失敗する原因や反対意見も検討し、見落としたリスクと代替案を教えて。"},{"id":"11","title":"進捗と重複作業を整理","category":"長期作業","body":"前回と最新版を比較して、進んだこと・残る問題・増えた作業を整理して。Chat・Codex・Work・定期実行の担当が重複していないか確認し、残作業を優先順位順に示して。"},{"id":"12","title":"次回へ引き継ぐ","category":"長期作業","body":"別のChat・Codex・Workで続きを進められるように、目的・最新版・決定事項・検証結果・残作業・次の一手を、コピペできる引き継ぎ指示にまとめて。"}];
const $=id=>document.getElementById(id);
const selected=new Set();let favorites=new Set();try{favorites=new Set(JSON.parse(localStorage.getItem('phraseFavoritesCompact12')||'[]'))}catch{}
const cats=[...new Set(data.map(x=>x.category))];cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('cat').append(o)});
function notify(msg){let t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',1600)}
async function copyText(text){
  // Prefer the modern clipboard API on HTTPS; fall back to a selectable textarea.
  try{if(!navigator.clipboard?.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText(text);notify('コピーしました');return}catch{}
  const el=document.createElement('textarea');el.value=text;el.setAttribute('readonly','');el.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';document.body.append(el);
  el.focus();el.select();el.setSelectionRange(0,el.value.length);
  let ok=false;try{ok=document.execCommand('copy')}catch{}
  el.remove();if(ok){notify('コピーしました');return}
  const box=$('composed');box.hidden=false;box.value=text;box.focus();box.select();box.setSelectionRange(0,box.value.length);
  notify('自動コピーできません。表示された文章を長押ししてコピーしてください');
}
function updateCombined(){let txt=data.filter(e=>selected.has(e.id)).map(e=>e.body).join('\n\n');$('composed').value=txt;$('chosenCount').textContent=selected.size;$('composed').hidden=selected.size===0}
function render(){let q=$('q').value.trim().toLowerCase(),cat=$('cat').value,only=$('favonly').checked;let matches=data.filter(e=>(!q||(e.title+' '+e.body+' '+e.category).toLowerCase().includes(q))&&(!cat||e.category===cat)&&(!only||favorites.has(e.id)));$('count').textContent=`${matches.length} / ${data.length} 件表示`;let root=$('cards');root.replaceChildren();for(let e of matches){let card=document.createElement('article');card.className='card'+(selected.has(e.id)?' selected':'');let top=document.createElement('div');top.className='top';let num=document.createElement('span');num.className='number';num.textContent=e.id;let title=document.createElement('span');title.className='title';title.textContent=e.title;top.append(num,title);let cat=document.createElement('div');cat.className='category';cat.textContent=e.category;let body=document.createElement('div');body.className='body';body.textContent=e.body;let actions=document.createElement('div');actions.className='actions';let copy=document.createElement('button');copy.textContent='コピー';copy.className='primary';copy.onclick=()=>copyText(e.body);let add=document.createElement('button');add.textContent=selected.has(e.id)?'✓ 選択中':'＋ 追加';add.onclick=()=>{selected.has(e.id)?selected.delete(e.id):selected.add(e.id);updateCombined();render()};let fav=document.createElement('button');fav.textContent=favorites.has(e.id)?'★ お気に入り':'☆ お気に入り';fav.onclick=()=>{favorites.has(e.id)?favorites.delete(e.id):favorites.add(e.id);try{localStorage.setItem('phraseFavoritesCompact12',JSON.stringify([...favorites]))}catch{}render()};actions.append(copy,add,fav);card.append(top,cat,body,actions);root.append(card)}}
['q','cat','favonly'].forEach(id=>$(id).addEventListener('input',render));$('clear').onclick=()=>{$('q').value='';$('cat').value='';$('favonly').checked=false;render()};$('copyCombined').onclick=()=>selected.size?copyText($('composed').value):notify('先にフレーズを追加してください');$('resetChosen').onclick=()=>{selected.clear();updateCombined();render()};updateCombined();render();
$('aiCopy').onclick=()=>{const goal=$('aiGoal').value.trim();if(!goal){notify('やりたいことを入力してください');$('aiGoal').focus();return}const catalog=data.map(e=>e.id+'｜'+e.title+'：'+e.body).join('\n');const prompt='次の目的について、以下の既存12フレーズから適切なものを選び、必要に応じて統合・修正し、Chat・Codex・Workのうち目的に最適な担当を判断し、コピペ可能な実行用指示を1つ作ってください。Chatは相談・調査・比較・文章作成、Codexはコード編集・GitHubリポジトリ開発・テスト、Workはブラウザ操作・複数サービス横断・まとまった実務に向いています。ChatやCodexで十分ならWorkを選ばず、必要な場合のみ併用し、各担当の範囲・順序・重複回避を明示してください。既存成果物と進捗を優先し、不要な作業を増やさず、事実・推測・未確認を区別してください。選んだフレーズ番号と理由も簡潔に示してください。指示の作成だけを行い、作業はまだ実行しないでください。\n\n【目的】\n'+goal+'\n\n【既存12フレーズ】\n'+catalog;copyText(prompt)};
</script></body></html>
